name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 777000838881.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: mern-app
  EKS_CLUSTER: mern-cluster

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint backend
        working-directory: backend
        run: |
          npm install
          npx eslint src/**/*.js --max-warnings=0 || true

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm install
          npx eslint src/**/*.{js,jsx} --max-warnings=0 || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Test backend
        working-directory: backend
        run: |
          npm install
          npm test

      - name: Test frontend
        working-directory: frontend
        run: |
          npm install
          npm test

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA=${{ github.sha }}
          SHORT_SHA=${SHA::7}
          echo "backend_tag=backend-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "frontend_tag=frontend-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.backend_tag }} ./backend

      - name: Build frontend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.frontend_tag }} ./frontend

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.backend_tag }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.frontend_tag }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push backend
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.backend_tag }}

      - name: Push frontend
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.frontend_tag }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy with Helm
        run: |
          helm upgrade --install mern-app helm/mern-app \
            --set backend.tag=${{ needs.build-and-scan.outputs.backend_tag }} \
            --set frontend.tag=${{ needs.build-and-scan.outputs.frontend_tag }} \
            --wait \
            --timeout 10m
